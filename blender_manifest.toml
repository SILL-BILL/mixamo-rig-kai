schema_version = "1.0.0"

id = "mixamo_rig_kai"
version = "0.4.0"
name = "Mixamo Rig Kai"
tagline = "Variable spine and neck support for Mixamo rigs"
maintainer = "Gonsaku"
type = "add-on"

website = "https://github.com/SILL-BILL/mixamo-rig-kai"

tags = ["Import-Export", "Rigging"]

blender_version_min = "4.2.0"
blender_version_max = "5.5.999"

license = ["SPDX:GPL-3.0-or-later"]

copyright = [
  "2024 Adobe, Tyler Walker",
  "2021 Adobe",
]

# Build configuration to exclude unnecessary files
[build]
paths_exclude_pattern = [
  "__pycache__/",
  ".mypy_cache/",
  "/.git/",
  "/.github/",
  ".gitignore",
  ".gitattributes",
  "*.pyc",
  "*.pyo",
  "*.pyd",
  "*.zip",
  "*.log",
  "*.bat",
  "*.sh",
  "*.command",
  ".DS_Store",
  "Thumbs.db",
  ".vscode/",
  ".idea/",
  "*.egg-info/",
  ".pytest_cache/",
  ".tox/",
  ".coverage",
  "*.sublime-*",
]
